name: MediaMesh Silo plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/mediamesh/**'
      - 'tools/silo-plugin-test.*'
      - '.github/workflows/mediamesh-plugin.yml'
  pull_request:
    paths:
      - 'plugins/mediamesh/**'
      - 'tools/silo-plugin-test.*'
      - '.github/workflows/mediamesh-plugin.yml'

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: JavaScript syntax
        run: |
          node --check plugins/mediamesh/service.js
          node --check plugins/mediamesh/app.js
      - name: Pinned Silo runtime, loader and bindings
        run: python3 -I tools/silo-plugin-test.py --race
      - name: Package plugin
        run: |
          python3 -I -c "from pathlib import Path; from zipfile import ZipFile; p=Path('plugins/mediamesh'); z=ZipFile('mediamesh.zip','w'); [z.write(p/n,n) for n in ['info.yaml','service.js','index.html','app.js','style.css']]; z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: MediaMesh-Silo-plugin
          path: mediamesh.zip

name: P2Play

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
  pull_request:

defaults:
  run:
    shell: bash

env:
  BOOST_VERSION: 1.86.0
  BOOST_HEADERS: /opt/boost-headers
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go for pinned Silo integration
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: false

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt-get update || true
          sudo apt-get install -y cmake ninja-build xz-utils curl python3-pip dante-server strace iproute2 nftables util-linux
          pip3 install --break-system-packages libtorrent

      - name: Cache Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.BOOST_HEADERS }}
          key: boost-headers-${{ env.BOOST_VERSION }}-${{ hashFiles('patches/boost/**', 'ci/boost-headers.sh') }}

      - name: Boost headers
        run: sudo -E ci/boost-headers.sh "$BOOST_VERSION" "$BOOST_HEADERS"

      - name: Build
        run: |
          exec > >(tee -a job.log) 2>&1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBOOST_INCLUDE_DIR="$BOOST_HEADERS"
          cmake --build build --target p2play_release -j$(nproc)

      # the TorrServer MatriX API as pPlay and Lampa use it: RAM storage, RAM with a cache smaller
      # than the file (pieces dropped and downloaded again), disk storage
      - name: Core test
        run: |
          exec > >(tee -a job.log) 2>&1
          python3 tools/core-test.py build/src/app/p2playd
          python3 tools/core-test.py build/src/app/p2playd --cache16
          python3 tools/core-test.py build/src/app/p2playd --disk
          python3 tools/auth-test.py build/src/app/p2playd
          python3 tools/silo-test.py build/src/app/p2playd
          python3 tools/mesh-test.py build/src/app/p2playd
          python3 -I tools/mesh-meta-test.py build/src/app/p2playd
          python3 tools/meshnet-test.py build/src/app/p2playd
          python3 -I tools/ui-test.py build/src/app/p2playd
          # The product API must build even when the optional MatriX compatibility layer is off.
          cmake -S . -B build-native-api -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBOOST_INCLUDE_DIR="$BOOST_HEADERS" -DP2P_COMPAT_MATRIX=OFF
          cmake --build build-native-api --target p2play_core -j$(nproc)
          python3 -I tools/grabber-test.py

      - name: MediaMesh stage 3 integration
        run: |
          exec > >(tee -a job.log) 2>&1
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc/core tools/mesh-queue-test.cpp -o /tmp/mesh-queue-test
          /tmp/mesh-queue-test
          python3 -I tools/peer-items-test.py build/src/app/p2playd
          python3 -I tools/mediamesh-interop-test.py build/src/app/p2playd
          python3 -I tools/mesh-media-test.py build/src/app/p2playd
          python3 -I tools/mesh-selective-test.py build/src/app/p2playd
          python3 -I tools/mesh-scale-test.py build/src/app/p2playd
          python3 -I tools/proxy-test.py build/src/app/p2playd
          python3 -I tools/proxy-dante-test.py build/src/app/p2playd --trace
          python3 -I tools/proxy-netns-test.py build/src/app/p2playd
          node --check plugins/mediamesh/service.js
          node --check plugins/mediamesh/app.js

      # This builds the pinned Silo host and runs the real plugin + torrent engine
      # against a local P2Play catalog, tracker and seeder.
      - name: Live Silo MediaMesh playback
        run: |
          exec > >(tee -a job.log) 2>&1
          python3 -c "import libtorrent; print('libtorrent import OK')"
          python3 tools/silo-live-test.py build/src/app/p2playd

      # The storage harness reads Makefile compile flags; keep this separate from Ninja.
      - name: MediaMesh storage sanitizers
        run: |
          exec > >(tee -a job.log) 2>&1
          cmake -S . -B build-mesh-storage -G 'Unix Makefiles' -DBOOST_INCLUDE_DIR="$BOOST_HEADERS"
          cmake --build build-mesh-storage --target torrent-rasterbar -j$(nproc)
          python3 -I tools/mesh-media-test.py --build-dir build-mesh-storage --sanitize

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Linux
          path: build/release/*

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Symbols-Linux
          path: build/symbols/*
          retention-days: 90

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "P2Play Linux" job.log
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          apt-get update || true
          apt-get install -y cmake curl xz-utils patch

      - name: Cache Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.BOOST_HEADERS }}
          key: boost-headers-${{ env.BOOST_VERSION }}-${{ hashFiles('patches/boost/**', 'ci/boost-headers.sh') }}

      - name: Boost headers
        run: ci/boost-headers.sh "$BOOST_VERSION" "$BOOST_HEADERS"

      - name: Build
        run: |
          exec > >(tee -a job.log) 2>&1
          cmake -S . -B build -G "Unix Makefiles" -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release \
            -DBOOST_INCLUDE_DIR="$BOOST_HEADERS"
          set -o pipefail
          cmake --build build --target p2play_release -j$(nproc) -- -k 2>&1 | tee build.log
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-readelf -S build/symbols/p2play.elf | grep -q "\.debug_info"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Switch-log
          path: build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Switch
          path: build/release/*

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Symbols-Switch
          path: build/symbols/*
          retention-days: 90

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "P2Play Switch" job.log
  ps4:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt-get update || true
          sudo apt-get install -y pacman-package-manager libarchive-tools cmake make curl xz-utils

          sudo tee -a /etc/pacman.conf > /dev/null <<TEXT
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          TEXT

          sudo pacman --noconfirm -Sy
          sudo pacman --noconfirm -S --needed ps4-openorbis ps4-openorbis-portlibs

          # Fix missing header (as in pPlay)
          sudo mkdir -p /opt/pacbrew/ps4/openorbis/include/sys
          echo '#include <endian.h>' | sudo tee /opt/pacbrew/ps4/openorbis/include/sys/endian.h > /dev/null

      - name: Cache Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.BOOST_HEADERS }}
          key: boost-headers-${{ env.BOOST_VERSION }}-${{ hashFiles('patches/boost/**', 'ci/boost-headers.sh') }}

      - name: Boost headers
        run: sudo -E ci/boost-headers.sh "$BOOST_VERSION" "$BOOST_HEADERS"

      - name: Build
        run: |
          exec > >(tee -a job.log) 2>&1
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          cmake -S . -B build -G "Unix Makefiles" -DPLATFORM_PS4=ON -DCMAKE_BUILD_TYPE=Release \
            -DBOOST_INCLUDE_DIR="$BOOST_HEADERS"
          set -o pipefail
          cmake --build build --target p2play_release -j$(nproc) -- -k 2>&1 | tee build.log
          ci/ps4-check-sections.sh build/src/app/p2play

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-PS4-log
          path: build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-PS4
          path: build/release/*

      # crash.log offsets: llvm-addr2line -f -C -e p2play.elf <offset>
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Symbols-PS4
          path: build/symbols/*
          retention-days: 90

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "P2Play PS4" job.log
  ps5:
    runs-on: ubuntu-24.04
    env:
      PS5_SDK_VERSION: v0.41.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt-get update || true
          sudo apt-get install -y clang-18 lld-18 build-essential cmake curl xz-utils wget

          sudo mkdir -p /opt/ps5-payload-sdk
          wget -nv https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/${PS5_SDK_VERSION}/ps5-payload-dev.tar.gz
          sudo tar -xzf ps5-payload-dev.tar.gz -C /
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Cache Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.BOOST_HEADERS }}
          key: boost-headers-${{ env.BOOST_VERSION }}-${{ hashFiles('patches/boost/**', 'ci/boost-headers.sh') }}

      - name: Boost headers
        run: sudo -E ci/boost-headers.sh "$BOOST_VERSION" "$BOOST_HEADERS"

      - name: Build
        run: |
          exec > >(tee -a job.log) 2>&1
          /opt/ps5-payload-sdk/bin/prospero-cmake -S . -B build -DPLATFORM_PS5=ON -DCMAKE_BUILD_TYPE=Release \
            -DPS5_PAYLOAD_SDK=/opt/ps5-payload-sdk -DBOOST_INCLUDE_DIR="$BOOST_HEADERS"
          set -o pipefail
          cmake --build build --target p2play_release -j$(nproc) -- -k 2>&1 | tee build.log
          readelf -S build/symbols/p2play.elf | grep -q "\.debug_info"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-PS5-log
          path: build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-PS5
          path: build/release/*

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Symbols-PS5
          path: build/symbols/*
          retention-days: 90

  # PS5 package: a PS4 "gd" package which sends p2play.elf to elfldr (src/app/ps5/launcher)

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "P2Play PS5" job.log
  ps5-pkg:
    needs: ps5
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt-get update || true
          sudo apt-get install -y pacman-package-manager libarchive-tools cmake make

          sudo tee -a /etc/pacman.conf > /dev/null <<TEXT
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          TEXT

          sudo pacman --noconfirm -Sy
          sudo pacman --noconfirm -S --needed ps4-openorbis

      - name: Download PS5 build
        uses: actions/download-artifact@v8
        with:
          name: P2Play-PS5
          path: ps5-input

      - name: Build
        run: |
          exec > >(tee -a job.log) 2>&1
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          cmake -S src/app/ps5/launcher -B build-ps5pkg \
            -DCMAKE_TOOLCHAIN_FILE=${OPENORBIS}/cmake/ps4.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DP2PLAY_ELF="$PWD/ps5-input/p2play/p2play.elf"
          cmake --build build-ps5pkg --verbose
          ci/ps4-check-sections.sh build-ps5pkg/p2play_launcher
          mkdir -p release
          cp build-ps5pkg/*.pkg release/
          ls -lh release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-PS5-pkg
          path: release/*.pkg

  # Android: one APK (arm64-v8a, armeabi-v7a), p2playd run by a foreground service

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "P2Play PS5 package" job.log
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      # Cache the Gradle wrapper and resolved dependencies. Allow trusted branch
      # builds to seed their own cache; keep fork PR caches read-only.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          cache-cleanup: always

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt-get update || true
          sudo apt-get install -y cmake ninja-build xz-utils curl
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Cache Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.BOOST_HEADERS }}
          key: boost-headers-${{ env.BOOST_VERSION }}-${{ hashFiles('patches/boost/**', 'ci/boost-headers.sh') }}

      - name: Boost headers
        run: sudo -E ci/boost-headers.sh "$BOOST_VERSION" "$BOOST_HEADERS"

      # the signing key of pPlay if its secrets are set, else the runner's debug key
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          exec > >(tee -a job.log) 2>&1
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/p2play.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/p2play.keystore" >> $GITHUB_ENV
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          exec > >(tee -a job.log) 2>&1
          echo "NDK: $ANDROID_NDK_HOME"
          set -o pipefail
          ci/android-apk.sh "$BOOST_HEADERS" 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Android-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Android
          path: release/p2play-android.apk

      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: P2Play-Symbols-Android
          path: |
            release/arm64-v8a
            release/armeabi-v7a

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "P2Play Android" job.log

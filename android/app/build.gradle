apply plugin: 'com.android.application'

// set by the CI: the version, the signing key (else the debug one)
def env = System.getenv()

android {
    namespace 'com.freetushkan.p2play'
    compileSdk = 36

    defaultConfig {
        applicationId 'com.freetushkan.p2play'
        minSdkVersion 23
        targetSdk 36
        versionCode((env['P2PLAY_VERSION_CODE'] ?: '1') as int)
        versionName env['P2PLAY_VERSION_NAME'] ?: 'dev'
    }

    signingConfigs {
        release {
            if (env['ANDROID_KEYSTORE']) {
                storeFile file(env['ANDROID_KEYSTORE'])
                storePassword env['ANDROID_KEYSTORE_PASSWORD']
                keyAlias env['ANDROID_KEY_ALIAS']
                keyPassword env['ANDROID_KEY_PASSWORD'] ?: env['ANDROID_KEYSTORE_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig env['ANDROID_KEYSTORE'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    packaging {
        jniLibs {
            // extracted to nativeLibraryDir: the only place an app may run an executable from
            useLegacyPackaging = true
        }
    }
}

// P2Play for Android: one APK for arm64-v8a and armeabi-v7a. The native part is the
// server p2playd packaged as lib/<abi>/libp2playd.so (ci/android-apk.sh puts it into
// app/src/main/jniLibs): the system extracts it to nativeLibraryDir, the service runs it.
buildscript {
    repositories {
        google()
        // Google-hosted Maven Central mirror reduces 429s on shared CI egress.
        maven {
            name = 'GoogleMavenCentralMirror'
            url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
        }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

allprojects {
    repositories {
        google()
        // Google-hosted Maven Central mirror reduces 429s on shared CI egress.
        maven {
            name = 'GoogleMavenCentralMirror'
            url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
        }
        mavenCentral()
    }
}
